[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-cli-lab"
version = "1.0.0"
description = "Reproducible Linux command-line security exercises with checked evidence."
requires-python = ">=3.10"
authors = [{name = "Mohammad Rohaan"}]

[project.scripts]
linux-cli-lab = "cli_lab.__main__:main"

[tool.setuptools]
packages = ["cli_lab"]

[tool.setuptools.data-files]
"share/linux-cli-lab/data" = ["data/manifest.json", "data/risk_register.csv", "data/showcase.json", "data/project_sections.json"]
"share/linux-cli-lab/data/fixtures" = ["data/fixtures/awk_task.txt", "data/fixtures/grep_task.txt", "data/fixtures/xarg_task.txt", "data/fixtures/xxd_task.txt"]
"share/linux-cli-lab/data/fixtures/one" = ["data/fixtures/one/file_list_1.txt"]
"share/linux-cli-lab/data/fixtures/parts" = ["data/fixtures/parts/shortrockyou_01.txt", "data/fixtures/parts/shortrockyou_02.txt", "data/fixtures/parts/shortrockyou_03.txt", "data/fixtures/parts/shortrockyou_04.txt"]
"share/linux-cli-lab/data/fixtures/two" = ["data/fixtures/two/file_list_2.txt"]
